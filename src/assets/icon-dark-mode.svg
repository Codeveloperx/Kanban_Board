<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6ebf1"/>
      <stop offset="100%" stop-color="#9aa7b5"/>
    </linearGradient>
    <linearGradient id="purpleTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d7ce8"/>
      <stop offset="100%" stop-color="#6d3fc7"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9fef"/>
      <stop offset="100%" stop-color="#2f74d9"/>
    </linearGradient>
    <linearGradient id="tealTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fd0a8"/>
      <stop offset="100%" stop-color="#0f9f7f"/>
    </linearGradient>
    <linearGradient id="purpleBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1a8f2"/>
      <stop offset="100%" stop-color="#a37fe0"/>
    </linearGradient>
    <linearGradient id="blueBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ec4f7"/>
      <stop offset="100%" stop-color="#5aa1ea"/>
    </linearGradient>
    <linearGradient id="greenBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe28a"/>
      <stop offset="100%" stop-color="#93c85c"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- outer frame -->
  <rect x="20" y="20" width="600" height="600" rx="90" fill="url(#frameGrad)" filter="url(#frameShadow)"/>
  <!-- inner white panel -->
  <rect x="62" y="62" width="516" height="516" rx="60" fill="#ffffff"/>

  <!-- dots -->
  <circle cx="180" cy="140" r="15" fill="url(#purpleTop)"/>
  <circle cx="320" cy="140" r="15" fill="url(#blueTop)"/>
  <circle cx="460" cy="140" r="15" fill="url(#tealTop)"/>

  <!-- top row squares -->
  <rect x="110" y="185" width="140" height="140" rx="26" fill="url(#purpleTop)" filter="url(#softShadow)"/>
  <rect x="250" y="185" width="140" height="140" rx="26" fill="url(#blueTop)" filter="url(#softShadow)"/>
  <rect x="390" y="185" width="140" height="140" rx="26" fill="url(#tealTop)" filter="url(#softShadow)"/>

  <!-- bottom row squares -->
  <rect x="110" y="345" width="140" height="140" rx="26" fill="url(#purpleBottom)" filter="url(#softShadow)"/>
  <rect x="250" y="345" width="140" height="140" rx="26" fill="url(#blueBottom)" filter="url(#softShadow)"/>
  <rect x="390" y="345" width="140" height="140" rx="26" fill="url(#greenBottom)" filter="url(#softShadow)"/>
</svg>
