<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d7ce8"/>
      <stop offset="100%" stop-color="#6d3fc7"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9fef"/>
      <stop offset="100%" stop-color="#2f74d9"/>
    </linearGradient>
    <linearGradient id="tealTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fd0a8"/>
      <stop offset="100%" stop-color="#0f9f7f"/>
    </linearGradient>
    <linearGradient id="purpleBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1a8f2"/>
      <stop offset="100%" stop-color="#a37fe0"/>
    </linearGradient>
    <linearGradient id="blueBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ec4f7"/>
      <stop offset="100%" stop-color="#5aa1ea"/>
    </linearGradient>
    <linearGradient id="greenBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe28a"/>
      <stop offset="100%" stop-color="#93c85c"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- dots -->
  <circle cx="145" cy="45" r="15" fill="url(#purpleTop)"/>
  <circle cx="300" cy="45" r="15" fill="url(#blueTop)"/>
  <circle cx="455" cy="45" r="15" fill="url(#tealTop)"/>

  <!-- top row squares -->
  <rect x="75" y="90" width="140" height="140" rx="26" fill="url(#purpleTop)" filter="url(#softShadow)"/>
  <rect x="230" y="90" width="140" height="140" rx="26" fill="url(#blueTop)" filter="url(#softShadow)"/>
  <rect x="385" y="90" width="140" height="140" rx="26" fill="url(#tealTop)" filter="url(#softShadow)"/>

  <!-- bottom row squares -->
  <rect x="75" y="250" width="140" height="140" rx="26" fill="url(#purpleBottom)" filter="url(#softShadow)"/>
  <rect x="230" y="250" width="140" height="140" rx="26" fill="url(#blueBottom)" filter="url(#softShadow)"/>
  <rect x="385" y="250" width="140" height="140" rx="26" fill="url(#greenBottom)" filter="url(#softShadow)"/>
</svg>
